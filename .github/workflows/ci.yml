name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Dependency cache mode for timing comparison (manual runs never deploy)
        type: choice
        options: [cached, uncached]
        default: cached

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URL: mongodb://localhost:27017
      DB_NAME: nutrigo_test
      GEMINI_API_KEY: test-key-not-a-live-key
      SENTRY_DSN: ''
      FRONTEND_URL: http://localhost:5173
      CACHE_MODE: ${{ inputs.cache_mode || 'cached' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ${{ inputs.cache_mode != 'uncached' && 'pip' || '' }}
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python scripts/ci_metrics.py backend-install -- python -m pip install -r requirements.txt
      - name: Import backend
        run: python -c "import app.main"
      - name: Mocked backend tests
        run: python scripts/ci_metrics.py backend-tests -- python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-timings
          path: .ci-metrics/*.json
          include-hidden-files: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_MODE: ${{ inputs.cache_mode || 'cached' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ inputs.cache_mode != 'uncached' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: python3 scripts/ci_metrics.py frontend-install -- npm ci --prefix frontend
      - name: Frontend tests
        run: python3 scripts/ci_metrics.py frontend-tests -- npm test --prefix frontend
      - name: Frontend lint
        run: python3 scripts/ci_metrics.py frontend-lint -- npm run lint --prefix frontend
      - name: Frontend production build
        run: python3 scripts/ci_metrics.py frontend-build -- npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-timings
          path: .ci-metrics/*.json
          include-hidden-files: true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan available Git history for secrets (redacted)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --log-opts=--all --redact --exit-code 1

  deploy:
    needs: [backend, frontend, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Request backend deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Missing RENDER_DEPLOY_HOOK_URL'; exit 1; }
          curl --fail --silent --show-error --max-time 60 -X POST "$DEPLOY_HOOK" > /dev/null
      - name: Verify database health and deployed revision
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: python3 scripts/check_deployment.py --url "$HEALTH_URL" --revision "$GITHUB_SHA"
